<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LEVEL UP</title>
  <meta name="description" content="Įpročių ir dienos užduočių sekiklis su XP, lygiais ir titulais. Veikia offline.">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LEVEL UP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Bendras auksinis gradientas progreso žiedams -->
  <svg width="0" height="0" class="absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lu-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFD36B"/>
        <stop offset="1" stop-color="#D99A0B"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <div class="min-h-[100dvh]"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="pointer-events-none fixed z-[60] inset-x-0 top-[calc(12px+env(safe-area-inset-top))] flex flex-col items-center gap-2 px-4"></div>

  <noscript>Šiai programėlei reikia JavaScript.</noscript>

  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/tasks.js"></script>
  <script src="js/screens/levels.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/friends.js"></script>
  <script src="js/screens/menu.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
